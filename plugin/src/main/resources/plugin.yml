name: UEliteShop
version: '${revision}'
main: cn.superiormc.ultimateshop.UltimateShop
api-version: 1.14
folia-supported: true
authors:
  - UnDeadlyDev
softdepend:
  # Protection
  - WorldGuard
  - Towny
  - Dominion
  - Lands
  - PlotSquared
  - BentoBox
  - Residence
  - GriefPrevention
  - HuskTowns
  - HuskClaims
  - SuperiorSkyblock2
  # Economy
  - Vault
  - PlayerPoints
  - UltraEconomy
  - CoinsEngine
  - ExcellentEconomy
  - RedisEconomy
  - RoyaleEconomy
  - EcoBits
  - PEconomy
  - VotingPlugin
  # Item
  - MMOItems
  - ItemsAdder
  - Oraxen
  - Nexo
  - EcoItems
  - EcoArmor
  - MythicMobs
  - ExecutableItems
  - CraftEngine
  - NeigeItems
  # Holograms
  - DecentHolograms
  - CMI
  - FancyHolograms
  # Others
  - ArcMenu
  - NBTAPI
  - packetevents
  - floodgate
  - PlaceholderAPI
  - AdvancedEnchantments
  - MythicChanger
commands:
  ueliteshop:
    aliases:
      - "shop"
    usage: "/ueliteshop"
    description: "UEliteShop Main Command."
permissions:
  ueliteshop.dialogpack:
    default: op
  ueliteshop.generateitemformat:
    default: op
  ueliteshop.editor:
    default: op
  ueliteshop.givesellstick:
    default: op
  ueliteshop.menu:
    default: true
  ueliteshop.quickbuy:
    default: op
  ueliteshop.quicksell:
    default: op
  ueliteshop.reload:
    default: op
  ueliteshop.saveitem:
    default: op
  ueliteshop.sellall:
    default: true
  ueliteshop.searchgui:
    default: op
  ueliteshop.sellhand:
    default: true
  ueliteshop.setbuytimes:
    default: op
  ueliteshop.setselltimes:
    default: op
  ueliteshop.bypassprice:
    default: false
